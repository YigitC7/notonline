
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Sayfa Bulunamadı | NotOnline</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Arial, sans-serif;
            background: #f5f7fc;
            color: #172033;
        }

        .error-container {
            width: 100%;
            max-width: 520px;
            text-align: center;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 42px;
            color: #172033;
            font-size: 23px;
            font-weight: 800;
            text-decoration: none;
            letter-spacing: -0.7px;
        }

        .brand-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 13px;
            background: #4f46e5;
            color: white;
            font-size: 23px;
            font-weight: 800;
            box-shadow: 0 5px 12px rgba(79, 70, 229, 0.2);
        }

        .error-card {
            padding: 42px 32px;
            background: #ffffff;
            border: 1px solid #e8ecf5;
            border-radius: 24px;
            box-shadow: 0 16px 45px rgba(25, 35, 70, 0.06);
        }

        .error-code {
            margin-bottom: 12px;
            color: #4f46e5;
            font-size: clamp(76px, 18vw, 112px);
            font-weight: 850;
            line-height: 1;
            letter-spacing: -7px;
        }

        .error-title {
            margin-bottom: 14px;
            font-size: 25px;
            font-weight: 750;
            letter-spacing: -0.8px;
        }

        .error-description {
            max-width: 350px;
            margin: 0 auto 28px;
            color: #64748b;
            font-size: 15px;
            line-height: 1.8;
        }

        .home-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            min-height: 48px;
            padding: 0 24px;
            border: none;
            border-radius: 12px;
            background: #4f46e5;
            color: white;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s,
                        box-shadow 0.2s;
        }

        .home-button:hover {
            background: #4338ca;
            transform: translateY(-2px);
            box-shadow: 0 7px 18px rgba(79, 70, 229, 0.2);
        }

        .home-button:focus-visible {
            outline: 3px solid #a5b4fc;
            outline-offset: 4px;
        }

        .footer {
            margin-top: 25px;
            color: #94a3b8;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .brand {
                margin-bottom: 28px;
            }

            .error-card {
                padding: 36px 20px;
                border-radius: 20px;
            }

            .error-title {
                font-size: 22px;
            }

            .error-description {
                font-size: 14px;
            }

            .home-button {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <main class="error-container">

        <a href="/" class="brand" aria-label="NotOnline ana sayfa">
            <span class="brand-icon">N</span>
            <span>NotOnline</span>
        </a>

        <section class="error-card">
            <div class="error-code">404</div>

            <h1 class="error-title">Sayfa bulunamadı</h1>

            <p class="error-description">
                Aradığın sayfa burada değil. Bağlantı yanlış olabilir
                veya bu sayfa kaldırılmış olabilir.
            </p>

            <a href="/" class="home-button">
                <span aria-hidden="true">←</span>
                Ana Sayfaya Dön
            </a>
        </section>

        <p class="footer">
            © NotOnline · Notlarını düzenle, fikirlerini sakla.
        </p>

    </main>
</body>
</html>
