
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ NoteDatas[1] }} | NotOnline</title>

    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --background: #f5f7fc;
            --surface: #ffffff;
            --text: #172033;
            --muted: #64748b;
            --border: #e5e9f2;
            --success: #15803d;
            --danger: #dc2626;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--background);
            color: var(--text);
            font-family: Inter, -apple-system, BlinkMacSystemFont,
                         "Segoe UI", sans-serif;
        }

        button,
        input,
        textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            min-height: 72px;
            padding: 12px 5%;
            background: rgba(255, 255, 255, 0.94);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(14px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
            min-width: 0;
        }

        .brand-icon {
            display: grid;
            place-items: center;
            width: 42px;
            height: 42px;
            flex-shrink: 0;
            border-radius: 13px;
            background: var(--primary);
            color: white;
            font-size: 23px;
            font-weight: 800;
            box-shadow: 0 5px 14px rgba(79, 70, 229, 0.2);
        }

        .brand-text {
            min-width: 0;
        }

        .brand-name {
            font-size: 17px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .brand-subtitle {
            margin-top: 3px;
            color: var(--muted);
            font-size: 12px;
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .nav-form {
            margin: 0;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            min-height: 40px;
            padding: 9px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: white;
            color: var(--text);
            font-size: 13px;
            font-weight: 650;
            text-decoration: none;
            transition: background 0.18s, border-color 0.18s,
                        transform 0.18s;
        }

        .button:hover {
            background: #f8faff;
            border-color: #cbd5e1;
        }

        .button:active {
            transform: scale(0.98);
        }

        .button-primary {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .button-primary:hover {
            background: var(--primary-hover);
            border-color: var(--primary-hover);
        }

        .button:disabled {
            opacity: 0.65;
            cursor: wait;
        }

        .main {
            width: min(1100px, 92%);
            margin: 35px auto 50px;
        }

        .editor-heading {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 22px;
        }

        .heading-label {
            margin-bottom: 8px;
            color: var(--primary);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1.4px;
            text-transform: uppercase;
        }

        .book-title {
            max-width: 700px;
            margin: 0;
            overflow-wrap: anywhere;
            font-size: clamp(25px, 4vw, 36px);
            font-weight: 800;
            letter-spacing: -1.2px;
            line-height: 1.2;
        }

        .heading-description {
            margin: 10px 0 0;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.6;
        }

        .editor-card {
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 18px;
            background: var(--surface);
            box-shadow: 0 10px 35px rgba(26, 39, 73, 0.055);
        }

        .editor-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 14px;
            padding: 15px 20px;
            border-bottom: 1px solid var(--border);
            background: #fcfcff;
        }

        .page-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .page-label {
            color: var(--muted);
            font-size: 13px;
            font-weight: 650;
        }

        .page-input {
            width: 78px;
            height: 39px;
            padding: 0 10px;
            border: 1px solid var(--border);
            border-radius: 9px;
            outline: none;
            background: white;
            color: var(--text);
            font-weight: 750;
            text-align: center;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .page-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .page-total {
            color: var(--muted);
            font-size: 13px;
        }

        .editor-hint {
            color: var(--muted);
            font-size: 12px;
        }

        .writing-area {
            padding: 14px 22px 20px;
        }

        .writing-area textarea {
            display: block;
            width: 100%;
            min-height: 500px;
            padding: 22px 8px;
            border: none;
            outline: none;
            resize: vertical;
            background: transparent;
            color: #263247;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 17px;
            line-height: 1.9;
            overflow-wrap: anywhere;
            tab-size: 4;
        }

        .writing-area textarea::placeholder {
            color: #a0a9b8;
        }

        .writing-area textarea:focus {
            outline: none;
        }

        .editor-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 14px;
            padding: 15px 20px;
            border-top: 1px solid var(--border);
            background: #fcfcff;
        }

        .writing-stats {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            color: var(--muted);
            font-size: 12px;
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            flex-shrink: 0;
            border-radius: 50%;
            background: #94a3b8;
        }

        .status-dot.success {
            background: #22c55e;
        }

        .status-dot.error {
            background: var(--danger);
        }

        .status-dot.saving {
            background: #f59e0b;
        }

        .footer-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .save-status {
            color: var(--muted);
            font-size: 12px;
        }

        .save-status.success {
            color: var(--success);
        }

        .save-status.error {
            color: var(--danger);
        }

        .bottom-note {
            margin-top: 17px;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.6;
            text-align: center;
        }

        @media (max-width: 600px) {
            .topbar {
                padding: 12px 4%;
            }

            .brand-subtitle {
                display: none;
            }

            .brand-name {
                font-size: 15px;
            }

            .top-actions {
                gap: 6px;
            }

            .button {
                min-height: 38px;
                padding: 8px 10px;
                font-size: 12px;
            }

            .main {
                width: 94%;
                margin-top: 26px;
            }

            .editor-heading {
                align-items: flex-start;
                margin-bottom: 18px;
            }

            .book-title {
                font-size: 27px;
            }

            .editor-card {
                border-radius: 14px;
            }

            .editor-toolbar {
                align-items: flex-start;
                padding: 13px;
            }

            .editor-hint {
                display: none;
            }

            .writing-area {
                padding: 8px 14px 14px;
            }

            .writing-area textarea {
                min-height: 55vh;
                padding: 15px 2px;
                font-size: 16px;
                line-height: 1.8;
            }

            .editor-footer {
                align-items: flex-start;
                padding: 13px;
            }

            .footer-actions {
                width: 100%;
            }

            .footer-actions .button {
                flex: 1;
            }

            .save-status {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header class="topbar">
    <div class="brand">
        <div class="brand-icon">N</div>

        <div class="brand-text">
            <div class="brand-name">NotOnline</div>
            <div class="brand-subtitle">Sadece yaz</div>
        </div>
    </div>

    <div class="top-actions">
        <form
            class="nav-form"
            action="/defter/i/{{ NoteDatas[0] }}/{{ NoteDatas[1] }}"
            method="get"
        >
            <button class="button" type="submit">ⓘ Bilgiler</button>
        </form>

        <form class="nav-form" action="/" method="get">
            <button class="button" type="submit">Ana Menü</button>
        </form>
    </div>
</header>

<main class="main">

    <section class="editor-heading">
        <div>
            <div class="heading-label">Defter</div>
            <h1 class="book-title">{{ NoteDatas[1] }}</h1>
        </div>
    </section>

    <section class="editor-card">

        <form id="noteForm">

            <div class="editor-toolbar">
                <div class="page-controls">
                    <label class="page-label" for="bookPage">
                        Sayfa
                    </label>

                    <input
                        class="page-input"
                        type="number"
                        id="bookPage"
                        min="1"
                        max="800"
                        step="1"
                        value="1"
                        required
                    >

                    <span class="page-total">/ 800</span>
                </div>

                <div class="editor-hint">
                    Sayfa değiştirerek yazılarına ulaşabilirsin.
                </div>
            </div>

            <div class="writing-area">
                <textarea
                    id="note"
                    maxlength="8000"
                    placeholder="Boş sayfa"
                    aria-label="Defter içeriği"
                    spellcheck="true"
                ></textarea>
            </div>

            <div class="editor-footer">
                <div class="writing-stats">
                    <div class="stat">
                        <span id="wordCount">0 kelime</span>
                    </div>

                    <div class="stat">
                        <span id="charCount">0 / 8000 karakter</span>
                    </div>

                    <div class="stat">
                        <span id="statusDot" class="status-dot"></span>
                        <span id="saveStatus" class="save-status" aria-live="polite">
                            Hazır
                        </span>
                    </div>
                </div>

                <div class="footer-actions">
                    <button
                        class="button button-primary"
                        id="saveButton"
                        type="submit"
                    >
                        Kaydet
                    </button>
                </div>
            </div>

        </form>

    </section>

    <p class="bottom-note">
        Yazıların kaydedilene kadar değişikliklerini bu sayfada tut.
        Sayfadan ayrılmadan önce kaydettiğinden emin ol.
    </p>

</main>

<script>
    const pageInput = document.getElementById("bookPage");
    const textarea = document.getElementById("note");
    const form = document.getElementById("noteForm");
    const saveButton = document.getElementById("saveButton");
    const saveStatus = document.getElementById("saveStatus");
    const statusDot = document.getElementById("statusDot");
    const wordCount = document.getElementById("wordCount");
    const charCount = document.getElementById("charCount");

    // Flask'tan gelen bilgiler
    const creater_username = {{ NoteDatas[0] | tojson }};
    const bookname = {{ NoteDatas[1] | tojson }};
    const savedNotes = {{ NoteDatas[2] | tojson }};

    // Sayfaların notları
    let notes = {};

    // Veritabanından gelen notları oku
    if (savedNotes !== null && savedNotes !== "") {
        try {
            if (typeof savedNotes === "string") {
                const jsonString = savedNotes.replace(/'/g, '"');
                notes = JSON.parse(jsonString);
            } else if (typeof savedNotes === "object") {
                notes = savedNotes;
            }
        } catch (error) {
            console.error("Not verisi okunamadı:", error);
            notes = {};
        }
    }

    if (!notes || typeof notes !== "object" || Array.isArray(notes)) {
        notes = {};
    }

    if (!("1" in notes)) {
        notes["1"] = "";
    }

    textarea.value = notes["1"] || "";
    pageInput.dataset.oldPage = "1";

    function updateStats() {
        const content = textarea.value;
        const trimmed = content.trim();
        const words = trimmed ? trimmed.split(/\s+/).length : 0;
        const chars = content.length;

        wordCount.textContent = `${words} kelime`;
        charCount.textContent = `${chars} / 8000 karakter`;

        charCount.style.color = chars >= 8000
            ? "#dc2626"
            : "#64748b";
    }

    function setStatus(message, type = "") {
        saveStatus.textContent = message;
        saveStatus.className = "save-status";

        if (type) {
            saveStatus.classList.add(type);
        }

        statusDot.className = "status-dot";

        if (type === "success") {
            statusDot.classList.add("success");
        } else if (type === "error") {
            statusDot.classList.add("error");
        } else if (type === "saving") {
            statusDot.classList.add("saving");
        }
    }

    function storeCurrentPage() {
        const currentPage = pageInput.dataset.oldPage || "1";
        notes[currentPage] = textarea.value;
    }

    textarea.addEventListener("input", function () {
        updateStats();
        setStatus("Kaydedilmemiş değişiklikler");
    });

    pageInput.addEventListener("change", function () {
        const requestedPage = Number(pageInput.value);

        if (
            !Number.isInteger(requestedPage) ||
            requestedPage < 1 ||
            requestedPage > 800
        ) {
            pageInput.value = pageInput.dataset.oldPage || "1";
            return;
        }

        storeCurrentPage();

        const newPage = String(requestedPage);

        if (!(newPage in notes)) {
            notes[newPage] = "";
        }

        textarea.value = notes[newPage] || "";
        pageInput.dataset.oldPage = newPage;

        updateStats();
        setStatus("Sayfa " + newPage);
    });

    form.addEventListener("submit", async function (event) {
        event.preventDefault();
        if (textarea.value.length > 8000) {
            setStatus("Bu sayfa en fazla 8000 karakter olabilir.", "error");
            return;
        }
        storeCurrentPage();

        saveButton.disabled = true;
        saveButton.textContent = "Kaydediliyor...";
        setStatus("Değişiklikler kaydediliyor...", "saving");

        try {
            const response = await fetch("/local-api/kaydet", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    notes: notes,
                    creater_username: creater_username,
                    bookname: bookname
                })
            });

            if (!response.ok) {
                throw new Error("Sunucu HTTP " + response.status + " yanıtı verdi.");
            }

            const result = await response.json();

            // API hata bilgisini JSON içinde döndürüyorsa göster.
            if (result && result.success === false) {
                throw new Error(result.message || "Kaydetme işlemi başarısız.");
            }

            setStatus("Başarıyla kaydedildi", "success");
        } catch (error) {
            console.error("Kaydetme hatası:", error);
            setStatus("Kaydedilemedi. Bağlantını kontrol et.", "error");
        } finally {
            saveButton.disabled = false;
            saveButton.textContent = "Kaydet";
        }
    });

    updateStats();
</script>

</body>
</html>
